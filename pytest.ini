[pytest]
pythonpath = module
testpaths =
    tests
    test/morgan
    module/chempyfi/interactions/test_apolar_surface.py
python_files = test_*.py
addopts = -ra
markers =
    unit: fast unit tests without external QC or visualization software
    characterization: regression tests that freeze representative algorithm outputs
    integration: tests requiring optional external software
    pymol: requires PyMOL
    orca: requires ORCA binary (local E2E only; not CI)
    opi: requires OPI (orca-pi)
    chempyfi_covaled_oracle: developer-only Excel numerical regression (e.g. 5L4Q)
